<title>Our Friendly Community Cat Colony</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2a2622;
    --muted: #7a726a;
    --line: #ece5db;
    --accent: #d98324;
    --accent-soft: #fbe9d3;
    --ok: #2e8b57;
    --ok-soft: #dff0e6;
    --warn: #b8791b;
    --warn-soft: #f7ecd6;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --card: #221e18;
      --text: #ece7df;
      --muted: #a99f92;
      --line: #35302a;
      --accent: #eaa04c;
      --accent-soft: #3a2c19;
      --ok: #63c98d;
      --ok-soft: #1c3327;
      --warn: #e0af5c;
      --warn-soft: #2f2513;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  header {
    padding: 30px 0 4px; display: flex; flex-wrap: wrap;
    align-items: flex-start; justify-content: space-between; gap: 10px 16px;
  }
  /* The masthead doubles as the home link, so it drops the link styling and
     only hints at being clickable on hover. */
  .home { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
  .home:hover h1 { color: var(--accent); }
  .home:hover .mark { border-color: var(--accent); }
  /* The paw is a sibling of the text column, not part of the h1 — inline it and
     its glyph box shoves the title right of the subtitle beneath it. */
  .mark {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent-soft); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 1.4rem; line-height: 1;
  }
  h1 { font-size: 1.8rem; margin: 0; letter-spacing: -.02em; }
  /* Narrow screens wrap the title over several lines, and centring the paw
     against that whole block strands it beside the middle line. Pin it to the
     top so it reads with the first line, and shrink the title so it wraps less. */
  @media (max-width: 640px) {
    .home { align-items: flex-start; gap: 12px; }
    .mark { width: 40px; height: 40px; font-size: 1.2rem; }
    h1 { font-size: 1.35rem; line-height: 1.3; }
  }
  .sub { color: var(--muted); margin: 4px 0 0; }
  /* External link (opens a Google Form), so it borrows the nav-pill look but
     sits apart from the in-site screen pills and carries an outbound marker. */
  .contact {
    flex-shrink: 0; margin-left: auto; text-decoration: none; color: var(--text); white-space: nowrap;
    padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); font-size: .92rem; box-shadow: var(--shadow);
    transition: border-color .15s ease, color .15s ease;
  }
  .contact:hover { border-color: var(--accent); color: var(--accent); }
  .contact .ext { opacity: .6; font-size: .85em; }

  nav {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-top: 18px;
  }
  .nav-inner { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; }
  .nav-inner a {
    text-decoration: none; color: var(--text); white-space: nowrap;
    padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); font-size: .92rem;
  }
  .nav-inner a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav-inner .n { opacity: .6; font-variant-numeric: tabular-nums; }
  .nav-inner a[aria-current="page"] .n { opacity: .85; }

  /* Stat tiles: figures in ink, one accent, one single-hue meter. No category color-coding. */
  .stats {
    display: grid; gap: 12px; margin: 22px 0 8px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px; box-shadow: var(--shadow);
  }
  .stat .num { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .num .of { font-size: 1rem; font-weight: 600; color: var(--muted); }
  .stat .lbl { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .stat .note { color: var(--muted); font-size: .72rem; margin-top: 6px; }
  /* Two-segment progress: solid = fixed, faded = trapped & waiting, track = not yet. */
  .meter { display: flex; gap: 2px; height: 6px; border-radius: 999px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .meter > span { display: block; height: 100%; }
  .meter .done { background: var(--accent); }
  .meter .prog { background: var(--accent); opacity: .4; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 4px; }
  input[type=search] {
    flex: 1 1 220px; min-width: 160px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .95rem;
  }
  .view-blurb { color: var(--muted); margin: 16px 0 2px; max-width: 60ch; }

  /* Search spans every screen; each match is grouped under its section so the
     screen a cat belongs to is always clear. */
  .results { margin: 24px 0 10px; }
  .results:last-of-type { margin-bottom: 60px; }
  .section-head {
    font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em;
    margin: 0; display: flex; align-items: baseline; gap: 8px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .section-head .n { font-size: .9rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .results .grid { margin: 14px 0 0; }

  .grid { display: grid; gap: 18px; margin: 16px 0 60px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .photo {
    aspect-ratio: 1 / 1; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .photo a { display: block; width: 100%; height: 100%; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s ease; }
  .photo a:hover img { transform: scale(1.04); }
  .photo .ph { font-size: 3rem; opacity: .5; }
  .corner { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: .7rem; font-weight: 600; padding: 4px 8px; border-radius: 999px;
    letter-spacing: .02em; box-shadow: 0 1px 4px rgba(0,0,0,.18); background: var(--accent); color: #fff;
  }
  .body { padding: 13px 15px 16px; }
  .name { font-size: 1.08rem; font-weight: 700; margin: 0 0 5px; display: flex; align-items: baseline; gap: 7px; }
  .name .sex { font-size: .9rem; color: var(--muted); font-weight: 500; }
  /* The name links to the cat's own screen. Underline on hover only — a grid of
     underlined names reads as a list of links rather than a set of headings. */
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: var(--accent); text-decoration: underline; }

  /* One cat on its own screen. The card is capped so its photo doesn't blow up
     to the full column width on a desktop. */
  .solo { max-width: 460px; margin: 14px auto 60px; }
  .back { color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--accent); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 9px; }
  .pill {
    font-size: .74rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .pill.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .status { font-size: .9rem; margin: 0 0 10px; }
  .status .slabel { display: block; text-transform: uppercase; letter-spacing: .04em; font-size: .66rem; color: var(--muted); margin-bottom: 1px; }
  .status .sval { color: var(--text); }
  .statement { font-size: .9rem; line-height: 1.45; margin: 0 0 12px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--text); }
  dl { margin: 0; font-size: .85rem; }
  dt { color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: .66rem; margin-top: 9px; }
  dd { margin: 1px 0 0; }
  .state { text-align: center; color: var(--muted); padding: 60px 20px; }
  .state.err { color: #c0392b; }
  footer { color: var(--muted); font-size: .82rem; padding: 0 0 50px; }
</style>

<div class="wrap">
  <header>
    <a class="home" href="#colony">
      <span class="mark" aria-hidden="true">🐾</span>
      <div>
        <h1>Our Friendly Community Cat Colony</h1>
        <p class="sub" id="sub">Loading…</p>
      </div>
    </a>
    <a class="contact" href="https://forms.gle/651qTXwfRUi73AGYA" target="_blank" rel="noopener">Contact us <span class="ext" aria-hidden="true">↗</span></a>
  </header>
</div>

<!-- Search is global — it spans every screen, so it sits above the screen pills. -->
<div class="wrap">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search all cats by name, status, litter…" autocomplete="off">
  </div>
</div>

<nav><div class="wrap"><div class="nav-inner" id="nav"></div></div></nav>

<main class="wrap" id="main">
  <div class="state" id="state">Loading…</div>
</main>

<div class="wrap"><footer>Site generated by Claude Code</footer></div>

<script>
const SHEET_ID = "1UHlnzkYfQK-DDTvkqu8x-IDl3tB7L8fdiBQw_-V9GzY";

// Views == screens. `colony` is home and carries the stats strip.
const VIEWS = [
  { key: "colony",   gid: "0",          nav: "Colony",        title: "The Colony",
    blurb: "Community cats active in the colony now." },
  { key: "adopted",  gid: "679410925",  nav: "Adopted by Me", title: "Adopted by Me",
    blurb: "Colony cats I ended up adopting." },
  { key: "visitors", gid: "1859449606", nav: "Feral Visitors", title: "Feral Visitors",
    blurb: "Fully feral and seen only every few months — too rarely to trap." },
  { key: "memoriam", gid: "2113017747", nav: "In Memoriam",   title: "In Memoriam",
    blurb: "Named colony cats that are no longer with us." },
];

// A synthetic screen with no sheet tab of its own: the cats flagged up for
// adoption, gathered across the living-cat screens and surfaced as its own nav
// pill. VIEWS stays the four real data tabs (they drive the fetch); NAV is what
// the nav bar renders.
const ADOPT_VIEW = { key: "adopt", nav: "💜 Up for Adoption", title: "Up for Adoption",
  blurb: "Colony cats currently looking for homes." };
const NAV = [ADOPT_VIEW, ...VIEWS];

const SITE_TITLE = "Our Friendly Community Cat Colony";

// Every cat has its own screen at #cat/<slug>, so a link to one specific cat can
// be texted to a neighbour. The slug is the name, lowercased, with runs of
// anything else collapsed to a dash — "Thomas (aka Hey Hey)" → "thomas-aka-hey-hey".
const slug = s => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const catUrl = name => `#cat/${slug(name)}`;
const catSlug = () => (location.hash.match(/^#cat\/(.+)$/) || [])[1] || null;

const gvizUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}`;

function parseGviz(text) {
  const json = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
  const cols = json.table.cols;
  let rows = json.table.rows.map(r => r.c);
  let headers;
  if (cols.some(c => c.label)) headers = cols.map((c, i) => c.label || `col${i}`);
  else headers = (rows.shift() || []).map(c => (c && c.v != null ? String(c.v) : ""));
  return rows.map(cells => {
    const o = {};
    headers.forEach((h, i) => {
      const c = cells[i];
      // Prefer the formatted value (c.f) — date cells arrive in c.v as the raw
      // "Date(2026,5,27)" serialization; c.f is what the sheet displays.
      const val = c ? (c.f != null ? c.f : c.v) : null;
      o[h] = val != null ? String(val).trim() : "";
    });
    return o;
  });
}

const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isYes = v => /^(yes|y|true)$/i.test((v || "").trim());
const isSoon = v => /week|soon|scheduled|pending/i.test(v || "");
// In-progress toward being fixed: "trapped and waiting" plus older phrasings.
const isProgress = v => /trapp|waiting|week|soon|scheduled|pending/i.test(v || "");
const lower = v => (v || "").toLowerCase();

// Neuter status → pill. Text label always present, never color alone.
// Matches the sheet's fixed set (no / yes / trapped and waiting) plus older
// free-text phrasings, so it keeps working during the switch-over.
function neuterPill(v) {
  const s = (v || "").trim();
  if (isYes(s)) return { cls: "ok", icon: "✓", label: "Spayed/neutered" };
  if (/trapp|waiting/i.test(s)) return { cls: "warn", icon: "◷", label: "Trapped, awaiting spay/neuter" };
  if (isSoon(s)) return { cls: "warn", icon: "◷", label: "Fixing soon" };
  if (/^no?$/i.test(s)) return { cls: "warn", icon: "•", label: "Not yet fixed" };
  return null;
}
let BYVIEW = {};   // key -> [rows]
let PHOTOS = {};

async function load() {
  const state = document.getElementById("state");
  try {
    const [photos, ...data] = await Promise.all([
      fetch("photos.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      ...VIEWS.map(v => fetch(gvizUrl(v.gid)).then(r => r.text()).then(parseGviz)),
    ]);
    PHOTOS = photos;
    VIEWS.forEach((v, i) => { BYVIEW[v.key] = data[i].filter(r => r.Name); });
    // The adoption screen has no tab of its own — it's derived: every cat flagged
    // up for adoption. Those cats only ever live on one real tab, so there's
    // nothing to de-dupe; a cat simply shows on both its home screen and here.
    BYVIEW.adopt = VIEWS.flatMap(v => BYVIEW[v.key].filter(c => isYes(c["Up for adoption?"])));
    document.getElementById("sub").textContent =
      `${BYVIEW.colony.length} cats in the colony · ${BYVIEW.adopted.length} adopted · ${BYVIEW.memoriam.length} remembered`;
    renderNav();
    // The search box is persistent (it lives above the nav), so wire it once here
    // rather than on every render. Typing re-routes with the new global query.
    const search = document.getElementById("search");
    search.addEventListener("input", () => { SEARCH = search.value.trim().toLowerCase(); route(); });
    // Clicking the masthead goes home. Navigating by href alone is silent when
    // the hash is already #colony, so handle that case by re-routing directly —
    // otherwise a search typed on the colony screen would survive the click.
    document.querySelector(".home").addEventListener("click", e => {
      e.preventDefault();
      SEARCH = "";
      search.value = "";
      if (location.hash === "#colony" || !location.hash) route();
      else location.hash = "colony";
    });
    window.addEventListener("hashchange", route);
    route();
  } catch (e) {
    state.className = "state err";
    state.textContent = "Couldn't load the sheet. Make sure it's still shared publicly. (" + e.message + ")";
  }
}

function currentView() {
  const key = location.hash.replace("#", "") || "colony";
  return NAV.find(v => v.key === key) || VIEWS[0];
}

function renderNav() {
  document.getElementById("nav").innerHTML = NAV.map(v =>
    `<a href="#${v.key}" data-key="${v.key}">${v.nav} <span class="n">${BYVIEW[v.key].length}</span></a>`
  ).join("");
}

function statsStrip() {
  const colony = BYVIEW.colony;
  const total = colony.length;
  const fixed = colony.filter(c => isYes(c["Neutered?"])).length;
  const waiting = colony.filter(c => isProgress(c["Neutered?"])).length;
  // Cats currently available to adopt (the derived adoption screen).
  const upForAdoption = BYVIEW.adopt.length;
  // Every cat I've ever had fixed — current colony, adopted, and gone alike.
  const fixedAllTime = VIEWS.reduce((n, v) =>
    n + BYVIEW[v.key].filter(c => isYes(c["Neutered?"])).length, 0);
  const pctFixed = total ? (fixed / total) * 100 : 0;
  const pctWait = total ? (waiting / total) * 100 : 0;

  // Colony spay/neuter gets its own tile: a two-segment meter (done + waiting)
  // so "how managed is the active colony" reads at a glance.
  const colonyTile = `
    <div class="stat">
      <div class="num">${fixed}<span class="of"> / ${total}</span></div>
      <div class="lbl">colony spayed / neutered</div>
      <div class="meter">
        <span class="done" style="width:${pctFixed}%"></span>
        <span class="prog" style="width:${pctWait}%"></span>
      </div>
      ${waiting ? `<div class="note">${waiting} trapped &amp; waiting</div>` : ""}
    </div>`;

  const tiles = [
    { num: total, lbl: "in the colony now" },
    { html: colonyTile },
    { num: fixedAllTime, lbl: "spayed / neutered, all-time" },
    { num: upForAdoption, lbl: "up for adoption" },
    { num: BYVIEW.adopted.length, lbl: "adopted into my home" },
    { num: BYVIEW.memoriam.length, lbl: "remembered" },
  ];
  return `<div class="stats">${tiles.map(t => t.html || `
    <div class="stat">
      <div class="num">${t.num}</div>
      <div class="lbl">${t.lbl}</div>
    </div>`).join("")}</div>`;
}

// `view` is the current screen. Neuter pills read differently per screen: a ✓
// shows everywhere; "not yet fixed" is a colony/adoption to-do; feral visitors
// come by too rarely to trap, so theirs isn't a to-do; adopted/gone cats show
// no negative.
function card(c, view, solo) {
  const name = c.Name;
  const photo = PHOTOS[name];
  const adopt = isYes(c["Up for adoption?"]);
  const inner = photo
    ? `<img loading="lazy" src="${esc(photo.img)}=w500" alt="${esc(name)}">`
    : `<span class="ph">🐈</span>`;
  // Clicking the photo opens its Google Photos share page in a new tab.
  const img = photo && photo.share
    ? `<a href="${esc(photo.share)}" target="_blank" rel="noopener" title="View ${esc(name)}'s photos">${inner}</a>`
    : inner;
  const tags = adopt ? `<div class="corner"><span class="tag">Adoptable</span></div>` : "";
  // The name is the way into a cat's own screen — except on that screen, where
  // it would link to itself.
  const nameHtml = solo ? esc(name) : `<a href="${catUrl(name)}">${esc(name)}</a>`;
  const np = neuterPill(c["Neutered?"]);
  const pillObjs = [];
  if (np && np.cls === "ok") {
    pillObjs.push(np);                                        // ✓ fixed — shown on every screen
  } else if (view.key === "visitors") {
    pillObjs.push({ cls: "warn", icon: "•", label: "Not fixed — rarely seen" });
  } else if ((view.key === "colony" || view.key === "adopt") && np) {
    pillObjs.push(np);                                        // not yet fixed / trapped & waiting
  }
  const pills = pillObjs.map(p => `<span class="pill ${p.cls}">${p.icon} ${p.label}</span>`).join("");
  // Status and Statement get their own display; everything else lists generically.
  const skip = new Set(["Photo", "Name", "Sex", "Status", "Statement", "Neutered?", "Up for adoption?"]);
  const details = Object.keys(c).filter(k => k && !skip.has(k) && c[k])
    .map(k => {
      let label = k.replace(/\?$/, "");
      let value = c[k];
      // A trailing "(qualifier)" in the header is really part of the data — the
      // owner hoists it there to avoid retyping it in every cell.
      const m = label.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
      if (m) { label = m[1]; value = `${value} (${m[2]})`; }
      return `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`;
    }).join("");
  return `<article class="card">
    <div class="photo">${img}${tags}</div>
    <div class="body">
      <p class="name">${nameHtml}${c.Sex ? `<span class="sex">${esc(c.Sex)}</span>` : ""}</p>
      ${pills ? `<div class="pills">${pills}</div>` : ""}
      ${c.Status ? `<div class="status"><span class="slabel">Status</span><span class="sval">${esc(c.Status)}</span></div>` : ""}
      ${c.Statement ? `<p class="statement">${esc(c.Statement)}</p>` : ""}
      <dl>${details}</dl>
    </div>
  </article>`;
}

// Search state is global — the box lives above the nav and searches every screen.
let SEARCH = "";

// Highlight one screen's nav pill and scroll it into view. The nav scrolls
// horizontally under ~768px, so landing on a later screen — from a link, a
// bookmark, a reload — would otherwise leave its pill off to the right with
// nothing in view looking selected. "nearest" is a no-op once the pill fits.
function markNav(key) {
  document.querySelectorAll("#nav a").forEach(a =>
    a.setAttribute("aria-current", a.dataset.key === key ? "page" : "false"));
  document.querySelector('#nav a[aria-current="page"]')
    ?.scrollIntoView({ inline: "nearest", block: "nearest" });
}

// One cat, on its own screen: the same card as the grid, plus a way back to the
// screen it lives on. Its data is fetched live like every other screen, so a
// cat added to the sheet has a working link straight away.
function renderCat(wanted) {
  const hit = VIEWS
    .map(v => ({ v, c: BYVIEW[v.key].find(r => slug(r.Name) === wanted) }))
    .find(x => x.c);
  const main = document.getElementById("main");
  markNav(hit ? hit.v.key : null);
  if (!hit) {
    document.title = SITE_TITLE;
    main.innerHTML = `<div class="state">
      There's no cat at that link.
      <p><a class="back" href="#colony">← See every cat</a></p>
    </div>`;
    return;
  }
  document.title = `${hit.c.Name} — ${SITE_TITLE}`;
  main.innerHTML = `
    <p class="view-blurb"><a class="back" href="#${hit.v.key}">← ${hit.v.title}</a></p>
    <div class="solo">${card(hit.c, hit.v, true)}</div>`;
}

function route() {
  // A search takes over the screen, single-cat view included.
  const cat = SEARCH ? null : catSlug();
  if (cat) return renderCat(cat);

  const v = currentView();
  if (!location.hash) location.hash = "#colony";
  document.title = SITE_TITLE;
  markNav(v.key);
  const searching = !!SEARCH;
  const match = c => !SEARCH ||
    Object.values(c).some(val => String(val).toLowerCase().includes(SEARCH));

  // A search broadens automatically to every screen, and results are grouped by
  // section so each match's screen stays clear. With no search it's just the
  // current screen. Cards render with their own view for screen-aware pills.
  let body, hasResults;
  if (searching) {
    const sections = NAV
      .map(view => ({ view, rows: BYVIEW[view.key].filter(match) }))
      .filter(s => s.rows.length);
    hasResults = sections.length > 0;
    body = sections.map(s => `
      <section class="results">
        <h2 class="section-head">${s.view.title} <span class="n">${s.rows.length}</span></h2>
        <div class="grid">${s.rows.map(c => card(c, s.view)).join("")}</div>
      </section>`).join("");
  } else {
    const rows = BYVIEW[v.key].filter(match);
    hasResults = rows.length > 0;
    body = `<div class="grid">${rows.map(c => card(c, v)).join("")}</div>`;
  }

  const main = document.getElementById("main");
  main.innerHTML = `
    ${!searching && v.key === "colony" ? statsStrip() : ""}
    <p class="view-blurb">${searching ? "Showing matches across every section." : v.blurb}</p>
    ${hasResults ? body : `<div class="state">No cats match.</div>`}`;
}

// Reset transient filters when switching screens so each screen starts clean.
window.addEventListener("hashchange", () => {
  SEARCH = "";
  const s = document.getElementById("search"); if (s) s.value = "";
});

load();
</script>
