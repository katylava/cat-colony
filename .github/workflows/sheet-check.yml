name: sheet-check

on:
  push:
    branches: ["claude/cat-colony-page-loading-nyrh3l"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the sheet endpoints anonymously
        run: |
          SHEET=1UHlnzkYfQK-DDTvkqu8x-IDl3tB7L8fdiBQw_-V9GzY
          PUB=2PACX-1vRVyTmBa643DI_S9TZC4DeFlvMq1KCp2JMe8D81SGGQ4qRkWOD9RN_vCLjsNTD1gdKhqatyiJvENEIS
          probe () {
            echo "=== $1"; rm -f body.txt
            curl -sSL --connect-timeout 10 --max-time 25 -o body.txt \
              -w 'http=%{http_code} size=%{size_download} time=%{time_total}s\n' "$2" || echo "curl failed rc=$?"
          }
          set +e
          probe "gviz colony"  "https://docs.google.com/spreadsheets/d/$SHEET/gviz/tq?tqx=out:json&gid=0"
          probe "news pubhtml" "https://docs.google.com/spreadsheets/d/e/$PUB/pubhtml?gid=1710528874&single=true&widget=false&headers=false"

      - name: Drive the page with Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          msgs = []
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.on("console", lambda m: msgs.append(f"{m.type}: {m.text}"))
              pg.goto("http://localhost:8000/index.html")
              # The news timeout is 8s; give the page room past it and no more.
              pg.wait_for_selector(".card", timeout=20000)
              cards = pg.locator("#main .card").count()
              panel = pg.locator("#newspanel").inner_html().strip()
              state = pg.locator("#state").count()
              sub = pg.locator("#sub").inner_text()
              print("cat cards rendered:", cards)
              print("sub line:", sub)
              print("news panel empty:", panel == "")
              print("error/loading state still present:", state)
              pg.screenshot(path="page.png", full_page=False)
              b.close()
          print("--- console ---")
          for m in msgs: print(m)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: page-screenshot
          path: page.png
